[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maska-heat"
version = "0.0.1"
description = "Price- and weather-aware home heating controller for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
melcloud = ["pymelcloud>=2.5.9", "aiohttp>=3.9"]
esphome = ["aioesphomeapi>=24.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
maska-probe = "maska_heat.probe:main"

[tool.setuptools.packages.find]
include = ["maska_heat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
