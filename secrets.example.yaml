# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored — never commit it.

adax:
  account_id: ""        # Adax app → Account → Remote API
  api_secret: ""        # generated in the same place

melcloud:
  email: ""
  password: ""

esphome:
  # API encryption keys, keyed by sensor name in config.yaml (same value as in the ESPHome device YAML)
