<!doctype html>
<html lang="en" data-tz="{{ tz_name }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Maska Heat{% endblock %}</title>
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#c2410c">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
  {# Served from the Pi (not a CDN): the controls must work when the internet is down but the LAN is up.
     htmx.org 1.9.12 dist/htmx.min.js, chart.js 4.4.4 dist/chart.umd.js — checked against jsDelivr's sha256. #}
  <script src="/static/vendor/htmx.min.js?v={{ static_v }}"></script>
  <script src="/static/vendor/chart.umd.js?v={{ static_v }}"></script>
  <script src="/static/app.js?v={{ static_v }}" defer></script>
</head>
<body>
  <header class="top">
    <a href="/" class="brand">Maska Heat</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Now</a>
      <a href="/control" {% if request.url.path == '/control' %}aria-current="page"{% endif %}>Control</a>
      <a href="/history" {% if request.url.path == '/history' %}aria-current="page"{% endif %}>History</a>
      <a href="/energy" {% if request.url.path == '/energy' %}aria-current="page"{% endif %}>Energy</a>
      <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
