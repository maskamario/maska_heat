{% extends "base.html" %}
{% block title %}History · Maska Heat{% endblock %}
{% block content %}
<form class="toolbar" method="get" action="/history">
  <label>Zone
    <select name="zone" onchange="this.form.submit()">
      {% for key, z in zones.items() %}
        <option value="{{ key }}" {% if key == zone %}selected{% endif %}>{{ z.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Period
    <select name="hours" onchange="this.form.submit()">
      {% for h, label in [(12, "12 h"), (24, "24 h"), (48, "2 days"), (168, "7 days"), (720, "30 days")] %}
        <option value="{{ h }}" {% if h == hours %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
</form>

{% if zone %}
<section class="card">
  <header class="card-head"><h2 id="history-title">Temperature</h2><span class="muted">°C · heater power on right axis · 🔥 = fire lit</span></header>
  <div class="chart tall"><canvas id="history-chart"></canvas></div>
</section>
<section class="card">
  <header class="card-head"><h2>Electricity price</h2><span class="muted">c/kWh incl. network &amp; VAT</span></header>
  <div class="chart"><canvas id="history-price-chart"></canvas></div>
</section>
<script>window.HISTORY = {zone: {{ zone | tojson }}, hours: {{ hours }}};</script>
{% else %}
<p class="muted">No zones configured.</p>
{% endif %}
{% endblock %}
