# Copy to config.yaml and adjust. config.yaml is git-ignored.
# Credentials do NOT go here — they go in secrets.yaml (see secrets.example.yaml).

location:
  latitude: 59.33     # Luige, Kiili vald
  longitude: 24.74
  timezone: Europe/Tallinn

price:
  area: ee            # Elering price area
  slot_minutes: 60    # hourly meter; set to 15 after meter upgrade

# All amounts €/kWh WITHOUT VAT, from the Alexela + Elektrilevi invoice of September 2026.
# Monthly fixed fees (25 A connection, seller monthly fee) are left out — they do not depend on when you heat.
# Until network rates are filled in, costs show spot price + VAT only.
tariff:
  vat: 0.24
  seller_margin_eur_kwh: 0.0             # seller's margin on top of spot (see contract)
  balancing_capacity_eur_kwh: 0.00373    # tarbimise tasakaalustamisvõimsuse kulu (Alexela)
  excise_eur_kwh: 0.0021                 # elektriaktsiis
  renewable_fee_eur_kwh: 0.0084          # taastuvenergia tasu
  security_of_supply_fee_eur_kwh: 0.00758  # varustuskindluse tasu
  network:                               # Elektrilevi Võrk 4
    day_eur_kwh: 0.0369
    night_eur_kwh: 0.021
    day_weekdays: [0, 1, 2, 3, 4]   # Mon–Fri
    day_start: "07:00"
    day_end: "22:00"
    holidays_are_night: true

devices:
  matis_mill:
    type: mill_local
    host: 192.168.1.12        # reserved DHCP address
    power_w: 1500
  madli_adax:
    type: adax_cloud
    room_name: null           # Adax app room name; null = first room on the account
    host: 192.168.1.11        # LAN address, unused while on cloud API
    power_w: 600
  living_mitsubishi:
    type: melcloud
    enabled: false            # enable once MELCloud login is in secrets.yaml
    device_name: null         # MELCloud device name; null = first air-to-air unit
  bathroom2_floor:
    type: tuya_thermostat     # Heatline HL-05 floor heating; logged only, not controlled
    host: 192.168.1.15        # reserved DHCP address
    device_id: ""             # Tuya device id (python -m tinytuya scan); local key in secrets.yaml → tuya
    protocol: 3.5
    power_w: 420              # floor mat; logged as 420 W while the thermostat heats
  water_heater:
    type: cozytouch           # Thermor Onix Connect 80 l; logged only, not controlled
    device_name: null         # Cozytouch device name; null = first water heater on the account
    power_w: 2250             # logged as 2250 W while it heats (unless Cozytouch reports power)

# IKEA DIRIGERA hub (local API; token in secrets.yaml → dirigera). Sensors and doors are matched by their name in
# the IKEA Home app. Check with: python -m maska_heat.probe dirigera
dirigera:
  host: 192.168.1.30           # reserve this address for the hub in the router
  poll_seconds: 15

# Room sensors: type dirigera (IKEA TIMMERFLOTTE) or esphome (see esphome/).
sensors:
  living:
    type: dirigera
    device: Allkorrus         # name in the IKEA Home app; living room, inner wall
  madli:
    type: dirigera
    device: Madli tuba
  matis:
    type: dirigera
    device: Matise tuba
  hall:
    type: dirigera
    device: Vahetuba          # upstairs hall between the kids' rooms
  outdoor:
    type: esphome
    enabled: false
    host: maska-outdoor-sensor.local

outdoor_sensor: outdoor       # used instead of the forecast when it has fresh data

# Door sensors (IKEA MYGGBETT): open = the room is coupled to the hall (docs/DESIGN.md §1.1)
doors:
  matis:
    device: Matise uks        # name in the IKEA Home app
    zone: matis
  madli:
    device: Madli uks
    zone: madli

zones:
  madli:
    name: Madli's bedroom
    device: madli_adax
    temp_sources: [sensor:madli, device:madli_adax]   # room sensor first, heater as fallback
    control_by: room          # targets are room temperatures; the heater's setpoint follows its sensor's gap
    school: true              # kids' room: school timetable applies (editable in UI)
  matis:
    name: Matis's bedroom
    device: matis_mill
    temp_sources: [sensor:matis, device:matis_mill]
    control_by: room
    school: true              # kids' room: school timetable applies (editable in UI)
  living:
    name: Living area
    device: living_mitsubishi
    temp_sources: [sensor:living, device:living_mitsubishi]   # first fresh source wins
  hall:
    name: Upstairs hall
    temp_sources: [sensor:hall]   # no heater: warmed by the bedrooms and the open stair
  bathroom2:
    name: Bathroom 2
    device: bathroom2_floor
  hot_water:
    name: Hot water
    device: water_heater

# Price-aware water heater: heats only in the cheapest hours (switch the Hot water zone to Smart in Control)
hot_water:
  zone: hot_water
  hours_per_day: 6            # allowed heating hours per day (a full reheat of 80 l takes ~2.5 h)
  morning_by: "06:30"         # at least morning_hours of them before this
  morning_hours: 3
  evening_from: "12:00"       # and evening_hours between these, for the evening wash
  evening_by: "19:00"
  evening_hours: 1
  boost_below_pct: 30         # outside the windows: boost once below this much hot water

# Price spikes: pause these zones during the day's most expensive hours (override from the app or the notification)
spike:
  zones: [madli, matis, bathroom2, hot_water]
  ratio: 1.4                  # spike hour: at least 1.4 × the day's average price …
  min_price_c: 35             # … and at least 35 c/kWh incl. network, fees and VAT
  max_hours: 3                # at most 3 spike hours a day (the most expensive)
  preheat: true               # rooms warm up to their comfort max in the cheaper hour before
  safety_min_temp: 18         # a paused room below this heats to its comfort min again
  notify_before_min: 60

notify:
  enabled: true
  app_url: http://maska-heat:8000   # how the phones reach the app (Tailscale name), for notification buttons
  ntfy_server: https://ntfy.sh
  offline_alert_minutes: 30
  quiet_start: "23:00"
  quiet_end: "06:30"

web:
  host: 0.0.0.0
  port: 8000

database: data/maska_heat.db
