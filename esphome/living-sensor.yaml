# Living area temperature/humidity sensor.
# Hardware: M5Stack Atom Lite (ESP32) + M5Stack ENV IV unit (SHT40) on the Grove port, USB-C powered.
# Flash from a browser: https://web.esphome.io (first time over USB), later updates over WiFi.
# Secrets go in esphome/secrets.yaml (git-ignored): wifi_ssid, wifi_password, living_api_key, ota_password.
# Generate the API key with: python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
# and put the same value in the app's secrets.yaml → esphome → living.

esphome:
  name: maska-living-sensor
  friendly_name: Living area sensor

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret living_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}            # fallback hotspot if WiFi is unreachable

captive_portal:

# Grove port on the Atom Lite
i2c:
  sda: GPIO26
  scl: GPIO32

sensor:
  - platform: sht4x
    temperature:
      name: Temperature
      accuracy_decimals: 2
    humidity:
      name: Humidity
      accuracy_decimals: 1
    update_interval: 30s

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 120s
