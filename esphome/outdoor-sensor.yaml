# Outdoor temperature sensor.
# Hardware: M5Stack Atom Lite (ESP32) + waterproof DS18B20 probe + DS18B20 adapter module (has the 4.7 kΩ pull-up
# resistor and a screw terminal). Wire the module to the Atom Lite's labelled header pins with female-female jumpers:
#   module VCC → 3V3     module GND → GND     module DAT → G25
# Use 3V3, not the Grove port's 5 V: the pull-up must go to 3.3 V to protect the ESP32 input.
# The Atom stays indoors (by a window, on USB power); only the probe cable goes outside to a shaded north wall.
# Secrets in esphome/secrets.yaml: wifi_ssid, wifi_password, outdoor_api_key, ota_password.

esphome:
  name: maska-outdoor-sensor
  friendly_name: Outdoor sensor

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret outdoor_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO25     # header pin G25

sensor:
  - platform: dallas_temp
    name: Temperature
    accuracy_decimals: 2
    update_interval: 60s

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 120s
